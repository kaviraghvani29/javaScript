<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #a8c6df, #869b9c);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: rgb(63, 67, 93);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 300px;
        }

        .box h2 {
            color: white;
            margin-bottom: 20px;
        }

        input {
            padding: 8px;
            width: 80%;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 15px;
            background: #181b1e;
            color: white;
            border: none;
            cursor: pointer;
        }

        .result {
            margin-top: 15px;
            color: white;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🌤 Check Weather</h2>
    <input type="text" id="city" placeholder="Enter city name">
    <br>
    <button onclick="getWeather()">Get Weather</button>

    <div class="result" id="output"></div>
</div>

<script src="weather.js"></script>
</body>
</html>
