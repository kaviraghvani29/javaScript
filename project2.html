<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple JS Slider</title>
</head>
<style>
* {
    box-sizing: border-box;
    height: 90vh;
}
body {
    font-family: Verdana, sans-serif; 
    margin:0;
    padding: 10px;
    background-color:#6f6b6b1e;
}
.mySlides {
    display: none
}
img {
  border-radius: 10px;
  vertical-align: middle;
  object-fit: cover;
}
.slideshow-container {
  max-width: 600px;
  position: relative;
  margin: auto;
}
.prev, .next {
  cursor: pointer;
  position: absolute;
  top: 50%;
  width: auto;
  height:auto;
  padding: 16px;
  margin-top: -22px;
  color: white;
  font-weight: bold;
  font-size: 18px;
  transition: 0.6s ease;
  border-radius: 0 3px 3px 0;
  /* user-select: none; */
}
.next {
  right: 0;
  border-radius: 3px 0 0 3px;
}
.prev:hover, .next:hover {
  background-color: rgba(0,0,0,0.8);
}
.text {
  color: #f2f2f2;
  font-size: 15px;
  padding: 8px 12px;
  position: absolute;
  bottom: 8px;
  width: 100%;
  text-align: center;
}

.numbertext {
  color: #f2f2f2;
  font-size: 12px;
  padding: 8px 12px;
  position: absolute;
  top: 0;
}

.dot_span{
  padding: 10px;
}

.dot {
  cursor: pointer;
  height: 15px;
  width: 15px;
  margin: 0 2px;
  background-color: #bbb;
  border-radius: 50%;
  display: inline-block;
  transition: background-color 0.6s ease;
}

.active, .dot:hover {
  background-color: #717171;
}

.fade {
  animation-name: fade;
  animation-duration: 1.5s;
}

@keyframes fade {
  from {opacity: .4} 
  to {opacity: 1}
}

</style>

<body>

<div class="slideshow-container">
    <div class="mySlides fade">
    <div class="numbertext">1 / 6</div>
    <img src="image/image (2).jpg" style="width:100%">
    </div>

    <div class="mySlides fade">
    <div class="numbertext">2 / 6</div>
    <img src="image/image (3).jpg" style="width:100%">
    </div>

    <div class="mySlides fade">
    <div class="numbertext">3 / 6</div>
    <img src="image/image (4).jpg" style="width:100%">
    </div>
    <div class="mySlides fade">
    <div class="numbertext">4 / 6</div>
    <img src="image/image (2).jpg" style="width:100%">
    </div>

    <div class="mySlides fade">
    <div class="numbertext">5 / 6</div>
    <img src="image/image (3).jpg" style="width:100%">
    </div>

    <div class="mySlides fade">
    <div class="numbertext">6 / 6</div>
    <img src="image/image (4).jpg" style="width:100%">
    </div>

    <a class="prev" onclick="plusSlides(-1)">❮</a>
    <a class="next" onclick="plusSlides(1)">❯</a>
</div>
<div class="dot_span" style="text-align:center">
  <span class="dot" onclick="currentSlide(1)"></span> 
  <span class="dot" onclick="currentSlide(2)"></span> 
  <span class="dot" onclick="currentSlide(3)"></span> 
</div>

<script src="project2.js"></script>
</body>
</html>
